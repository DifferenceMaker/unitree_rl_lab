  FixStand:
    transitions:
      Passive: LT + B.on_pressed
      Balance_symdr:       RB + Y.on_pressed
      Balance_sym_sharp:   RB + A.on_pressed
      Balance_sym_latloop: RB + X.on_pressed
      Balance_sym_fwdleft: RB + right.on_pressed
    kp: [
      250, 250, 250, 400, 80, 40,
      250, 250, 250, 400, 80, 40,
      600,
      250, 400, 80, 80, 20, 20, 20,
      250, 400, 80, 80, 20, 20, 20,
    ]
    kd: [
      6.5, 6.5, 6.5, 10, 1.5, 0.4,
      6.5, 6.5, 6.5, 10, 1.5, 0.4,
      6,
      6, 10, 2, 2, 0.5, 0.5, 0.5,
      6, 10, 2, 2, 0.5, 0.5, 0.5,
    ]
    ts: [0, 3]
    qs: [
      [],
      [ 0, -0.3, 0, 0.5, -0.2, 0,
        0, -0.3, 0, 0.5, -0.2, 0,
        0,
        0.35, 0.25, -0.1, 0.65, 0, 0, 0,
        0.35, -0.25, -0.1, 0.65, 0, 0, 0,
      ]
    ]

