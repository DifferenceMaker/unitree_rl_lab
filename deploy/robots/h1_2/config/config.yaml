    qs: [
      [],
      [ 0, -0.3, 0, 0.5, -0.2, 0,
        0, -0.3, 0, 0.5, -0.2, 0,
        0,
        0.35, 0.25, -0.1, 0.65, 0, 0, 0,
        0.35, -0.25, -0.1, 0.65, 0, 0, 0,
      ]
