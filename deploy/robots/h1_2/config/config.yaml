  FixStand:
    transitions:
      Passive: LT + B.on_pressed
      Balance_pay10_kp40:     RB + Y.on_pressed
      Balance_pay10_gold100:  RB + A.on_pressed
      Balance_pay10_perjoint: RB + X.on_pressed
      Balance_pay10_soft:     RB + right.on_pressed
