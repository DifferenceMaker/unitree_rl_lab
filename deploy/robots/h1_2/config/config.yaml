  # === p12f CoM-x BISECTION (hardware) ===
  # One axis, five points, ordered by the model's CoM fwd-of-pelvis offset:
  #   RB+Y  sym    +22.4mm  (p12f_base 3k refine   — falls BACKWARD, slow reaction: the 07-13 anchor)
  #   RB+A  comx0    0.0mm  (from-scratch 8250     — settles FORWARD, hair-trigger fwd: other anchor)
  #   RB+X  comx06  +5.6mm  (from-scratch snap 7475)
  #   RB+r  comx11 +11.2mm  (from-scratch snap 7475 — midpoint, primary probe)
  #   RB+d  comx17 +16.8mm  (from-scratch snap 7450)
  # VERDICT CRITERIA: still stance + SYMMETRIC fore/aft reaction threshold
  # (asymmetry direction tells which way the true CoM lies from that model).
  # All snaps iteration-matched (~7.5-8.2k); judge tendency, not polish.
  Balance_sym:
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p12f_base_2026-07-12
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

