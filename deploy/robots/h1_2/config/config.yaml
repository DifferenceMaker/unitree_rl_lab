      [ 0, -0.3, 0, 0.5, -0.2, 0,
        0, -0.3, 0, 0.5, -0.2, 0,
        0,
        0.35, 0.25, -0.1, 0.65, 0, 0, 0,
        0.35, -0.25, -0.1, 0.65, 0, 0, 0,
      ]
    ]

  # === p13 HARDWARE EVAL — walk stepping-quality genes (2026-07-31) ===
  # ALL comx06-trained, parent p12g_wide_micropush (model_11474), 6000 iters,
  # model_17473 each. New 3D soles. Reference on RB+Y = the parent itself.
  # Reads: gaitstep = stillness at rest must NOT degrade vs Y (the gate's whole
  # point); clearance = swing height on recovery steps; gait(prime) = do the
  # genes compose; contact500 = softer/quieter touchdowns (listen!).
  Balance_wide_micropush:  # RB+Y  PARENT/REFERENCE (hardware-best 07-30)
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p12g_wide_micropush_2026-07-14
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

  Balance_p13_gait:  # RB+A  PRIME: gated gait + clearance + contact500
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p13_gait_2026-07-30
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

  Balance_p13_clearance:  # RB+X  swing-quality only (IF a foot moves, lift properly)
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p13_clearance_2026-07-30
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

  Balance_p13_gaitstep:  # RB+B  recovery-gated antiphase gait only
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p13_gaitstep_2026-07-31
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

  Balance_p13_contact500:  # RB+right  hinged >500N touchdown force only
    transitions:
