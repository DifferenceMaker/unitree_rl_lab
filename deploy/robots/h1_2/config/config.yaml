  # === GROUP 3: envelope v2 (both trained through the full expanded envelope — yaw ±0.9,
  # decoupled L/R, overhead +1.5 — with hold_steps 12000). Baseline gold FALLS on OOD
  # asymmetric/overhead poses (the waltz); v2 should hold them. v2=40/3, v2_stiff trained
  # with stiff shoulders (80/4). KEY TEST via the CONTROLLER `arm <14 floats>` stdin (the
  # sim sliders are symmetric — use arm cmd for asymmetric/decoupled poses):
  #   waltz (killed gold):  arm 0.458 0.458 1.09 -1.09 0.945 0.945 0.173 0.173 0 0 0 0 0 0
  #   asymmetric L/R:       arm -0.8 0.5 0.5 0.2 0.9 -0.9 1.0 0.2 0 0 0 0 0 0
  #   overhead (arms up):   arm -1.5 -1.5 0.6 -0.6 0 0 0.3 0.3 0 0 0 0 0 0
  #   back to default:      arm default
  # Also push while holding a pose. Compare gold (falls) vs v2 (holds) vs v2_stiff.
  BalanceP8_gold:                        # RB+Y   baseline (no envelope — falls on OOD poses)
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p8_gold_2026-06-15
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0

  Balance_envelope_v2:                   # RB+A   full envelope, gentler ramp, gains 40/3
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p10_envelope_v2_2026-07-01
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0

  Balance_envelope_v2_stiff:             # RB+X   full envelope + TRAINED stiff sh 80/4·50/2·30/1
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p10_envelope_v2_stiff_2026-07-01
    arm_kp: [80,80, 80,80, 50,50, 50,50, 30,30, 30,30, 30,30]
    arm_kd: [4,4, 4,4, 2,2, 2,2, 1,1, 1,1, 1,1]
    arm_transition_s: 4.0