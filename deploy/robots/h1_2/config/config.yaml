  # Ultimate pass bar is ROS: |tau|max << 120 at quiet stance, zero
  # 'TAU CAP binding' lines, m5 ankle-roll temp flat over 6 min.
  Balance_comx06_snap:          # RB+Y / key 2   reference (hardware-proven; squeezes)
