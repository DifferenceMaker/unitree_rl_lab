      5,5,5,
      5,
      2,2,
      2,2,2,2,
      2,2,2,2,
    ]

  FixStand:
    transitions:
      Passive: LT + B.on_pressed
      Balance_parent:       RB + Y.on_pressed
      Balance_cush50:       RB + A.on_pressed
      Balance_latloop:      RB + X.on_pressed
      Balance_latloop_comdr: RB + right.on_pressed
      Balance_comdr:        RB + down.on_pressed
      Balance_imudr:        RB + left.on_pressed
      Balance_cush35:       RB + up.on_pressed
      Balance_cush75:       RB + B.on_pressed
    kp: [
      250, 250, 250, 400, 80, 40,
      250, 250, 250, 400, 80, 40,
      600,
      250, 400, 80, 80, 20, 20, 20,
      250, 400, 80, 80, 20, 20, 20,
    ]
    kd: [
      6.5, 6.5, 6.5, 10, 1.5, 0.4,
      6.5, 6.5, 6.5, 10, 1.5, 0.4,
      6,
      6, 10, 2, 2, 0.5, 0.5, 0.5,
      6, 10, 2, 2, 0.5, 0.5, 0.5,
    ]
    ts: [0, 3]
    qs: [
      [],
      [ 0, -0.3, 0, 0.5, -0.2, 0,
        0, -0.3, 0, 0.5, -0.2, 0,
        0,
        0.35, 0.25, -0.1, 0.65, 0, 0, 0,
        0.35, -0.25, -0.1, 0.65, 0, 0, 0,
      ]
    ]

  # === p12i SHOD+RUBBER eval — comx06 base, warmstart p12g_wide_feetnear ===
  # SIM: unitree_mujoco robot_scene = scene_comx06_soft08.xml (comx06 body +5.6mm
  #      + 0.08 cushion). MUST be the comx06 body — scene_sym_soft08 (SYM +22.4mm)
  #      is the WRONG body for these comx06 policies (spurious forward lean).
  #      launch_sim2sim.sh --tau for hip-roll torque.
  # All p12i = wide_feetnear stance (0.13/0.22/-40) + terrain compliant cushion.
  # cush50 = pre-divergence pick @model_14950; others completed.
  # Read: cushion sweep (35/50/75), does latloop splay legs (cush50 vs latloop),
  # is CoM-DR/IMU-OU worth it (comdr/imudr vs cush50).
  Balance_parent:          # RB+Y  p12g_wide_feetnear (comx06, the parent/reference)
    transitions:
      Passive: LT + B.on_pressed
    policy_dir: ../../../logs/milestones/p12g_wide_feetnear_2026-07-14
    arm_kp: 40.0
    arm_kd: 3.0
    arm_transition_s: 4.0
    engage_blend_s: 1.5

  Balance_cush50:          # RB+A  + 50k cushion (control: wide_feetnear on the shod sole)
    transitions:
